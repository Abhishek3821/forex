<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C8FF"/>
      <stop offset="55%" stop-color="#007BFF"/>
      <stop offset="100%" stop-color="#0047D9"/>
    </linearGradient>

    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#D9D9D9"/>
      <stop offset="100%" stop-color="#8E8E8E"/>
    </linearGradient>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- outer speed orbit -->
  <path d="M380 128 A170 170 0 1 0 394 355"
        fill="none"
        stroke="url(#blueGrad)"
        stroke-width="16"
        stroke-linecap="round"
        filter="url(#softGlow)"/>

  <!-- V mark -->
  <path d="M90 150 L170 340 L255 150 L218 150 L168 262 L126 150 Z"
        fill="url(#silverGrad)"/>

  <!-- upward execution arrow -->
  <path d="M150 370 L385 105 L365 172 L430 145 L190 372 Z"
        fill="url(#blueGrad)"
        filter="url(#softGlow)"/>

  <!-- candles -->
  <g fill="url(#blueGrad)" stroke="#64D8FF" stroke-width="4" stroke-linecap="round">
    <line x1="255" y1="300" x2="255" y2="380"/>
    <rect x="240" y="325" width="30" height="42" rx="2"/>

    <line x1="305" y1="265" x2="305" y2="360"/>
    <rect x="290" y="295" width="30" height="50" rx="2"/>

    <line x1="355" y1="225" x2="355" y2="330"/>
    <rect x="340" y="255" width="30" height="58" rx="2"/>
  </g>
</svg>
